<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Skibidi Firebase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <h1>🔥 Skibidi Notes</h1>

  <input id="msg" placeholder="Écris un message">
  <button onclick="envoyer()">Envoyer</button>

  <ul id="liste"></ul>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA0SI63eordXvmAVbSyJv3NUNV_6nhoY4M",
      authDomain: "skibidiordi.firebaseapp.com",
      databaseURL: "https://skibidiordi-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "skibidiordi",
      storageBucket: "skibidiordi.appspot.com",
      messagingSenderId: "337349106625",
      appId: "1:337349106625:web:c33de087e0ad61cc576d40"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const liste = document.getElementById("liste");
    const input = document.getElementById("msg");

    // envoyer un message
    window.envoyer = function () {
      if (input.value.trim() === "") return;

      push(ref(db, "messages"), {
        texte: input.value,
        date: Date.now()
      });

      input.value = "";
    };

    // lire les messages
    onValue(ref(db, "messages"), (snapshot) => {
      liste.innerHTML = "";
      const data = snapshot.val();
      for (let id in data) {
        const li = document.createElement("li");
        li.textContent = data[id].texte;
        liste.appendChild(li);
      }
    });
  </script>

</body>
</html>
