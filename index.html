<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SKIBIDI ENT 🔵</title>
<style>
body{font-family:Arial;background:#e8f0ff;margin:0}
header{background:#0b5ed7;color:white;padding:10px;text-align:center;font-size:24px}
.box{max-width:1000px;margin:20px auto;background:white;border-radius:10px;padding:15px}
button{background:#0b5ed7;color:white;border:none;padding:6px 10px;border-radius:5px}
.tab{display:inline-block;margin:5px;padding:6px 10px;background:#cfe2ff;border-radius:5px;cursor:pointer}
.tab.active{background:white;border-bottom:3px solid #0b5ed7}
.star{color:gold;font-size:18px}
.trash{cursor:pointer;color:red}
</style>
</head>
<body>

<header>📚 SKIBIDI ENT 🔵</header>

<div class="box" id="login">
  <h3>Connexion</h3>
  <input id="id" placeholder="Identifiant">
  <input id="pw" type="password" placeholder="Mot de passe">
  <button onclick="connect()">Se connecter</button>
  <p id="err" style="color:red"></p>
</div>

<div class="box" id="app" style="display:none">
  <div id="tabs"></div>
  <div id="content"></div>
</div>

<script>
const users={
  sahli:{pass:"sahli123",role:"prof",name:"M. Sahli"},
  bouhmadi:{pass:"bouhmadi123",role:"prof",name:"M. Bouhmadi"},
  ouachaou:{pass:"secretaire",role:"secretaire",name:"M. Ouachaou"},
  nassim:{pass:"nassim",role:"eleve",name:"Nassim"},
  arthur:{pass:"arthur",role:"eleve",name:"Arthur"},
  sarah:{pass:"sarah",role:"eleve",name:"Sarah"},
  rayan:{pass:"rayan",role:"eleve",name:"Rayan"},
  nathan:{pass:"nathan",role:"eleve",name:"Nathan"},
  aymend:{pass:"aymend",role:"eleve",name:"Aymen Dib"},
  aymenf:{pass:"aymenf",role:"eleve",name:"Aymen Ferhane"},
  nael:{pass:"nael",role:"eleve",name:"Nael"}
};

let current=null;
let data={notes:{},stars:{},appel:{},validation:{},missions:[],edtCancel:{}};

const edt={
  "Lundi":["10h05-10h25","15h00-15h20"],
  "Mardi":["10h05-10h25"],
  "Mercredi":["10h05-10h25"],
  "Jeudi":["10h05-10h25","15h00-15h20"],
  "Vendredi":["10h05-10h25"]
};

function connect(){
  if(!users[id.value]||users[id.value].pass!=pw.value){
    err.textContent="Identifiant ou mot de passe incorrect";
    return;
  }
  current=id.value;
  login.style.display="none";
  app.style.display="block";
  buildTabs();
}

function buildTabs(){
  let r=users[current].role;
  let t=["Notes","Étoiles","Missions","Emploi du temps","Appel"];
  if(r=="secretaire")t=["Justification"];
  let h="";
  t.forEach(x=>h+=`<span class="tab" onclick="openTab('${x}')">${x}</span>`);
  tabs.innerHTML=h;
  openTab(t[0]);
}

function openTab(n){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  [...tabs.children].find(x=>x.textContent==n).classList.add("active");
  if(n=="Notes")notesTab();
  if(n=="Étoiles")starsTab();
  if(n=="Missions")missionsTab();
  if(n=="Emploi du temps")edtTab();
  if(n=="Appel")appelTab();
  if(n=="Justification")justifTab();
}

function eleves(){return Object.keys(users).filter(u=>users[u].role=="eleve");}

/* NOTES */
function notesTab(){
  let h="<h3>📊 Notes</h3>";
  if(users[current].role=="prof"){
    h+=`<select id="e">${eleves().map(e=>`<option>${e}</option>`).join("")}</select>
        <input id="v" placeholder="15/20">
        <button onclick="addNote()">➕</button>`;
  }
  h+="<ul>";
  for(let e in data.notes){
    if(current==e||users[current].role!="eleve")
      data.notes[e].forEach(n=>h+=`<li>${users[e].name} : ${n}</li>`);
  }
  h+="</ul>";
  content.innerHTML=h;
}
function addNote(){
  if(!data.notes[e.value])data.notes[e.value]=[];
  data.notes[e.value].push(v.value);
  notesTab();
}

/* ÉTOILES */
function starsTab(){
  let h="<h3>⭐ Étoiles</h3>";
  if(users[current].role=="prof"){
    h+=`<select id="e">${eleves().map(e=>`<option>${e}</option>`).join("")}</select>
        <select id="v"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
        <button onclick="addStar()">➕</button>`;
  }
  h+="<ul>";
  for(let e in data.stars){
    if(current==e||users[current].role!="eleve")
      data.stars[e].forEach(s=>h+=`<li>${users[e].name} : ${"★".repeat(s)}</li>`);
  }
  h+="</ul>";
  content.innerHTML=h;
}
function addStar(){
  if(!data.stars[e.value])data.stars[e.value]=[];
  data.stars[e.value].push(parseInt(v.value));
  starsTab();
}

/* MISSIONS */
function missionsTab(){
  let h="<h3>📚 Missions</h3>";
  if(users[current].role=="prof"){
    h+=`<input id="m"><button onclick="addMission()">➕</button>`;
  }
  h+="<ul>"+data.missions.map(m=>`<li>${m}</li>`).join("")+"</ul>";
  content.innerHTML=h;
}
function addMission(){
  data.missions.push(m.value);
  missionsTab();
}

/* EDT */
function edtTab(){
  let h="<h3>🗓️ Emploi du temps</h3><ul>";
  for(let j in edt){
    h+=`<li>${j} : ${edt[j].join(" / ")}</li>`;
  }
  h+="</ul>";
  content.innerHTML=h;
}

/* APPEL */
function appelTab(){
  let h="<h3>📝 Appel</h3>";
  if(users[current].role=="prof"){
    h+=`<select id="e">${eleves().map(e=>`<option>${e}</option>`).join("")}</select>
        <select id="v"><option>Présent</option><option>Absent</option><option>Retard</option></select>
        <button onclick="setAppel()">Valider</button>`;
  }
  h+="<ul>";
  eleves().forEach(e=>{
    let st=data.appel[e]||"-";
    h+=`<li>${users[e].name} : ${st}</li>`;
  });
  h+="</ul>";
  content.innerHTML=h;
}
function setAppel(){
  data.appel[e.value]=v.value;
  appelTab();
}

/* SECRETAIRE */
function justifTab(){
  let h="<h3>📄 Justification d'absence</h3><ul>";
  for(let e in data.appel){
    h+=`<li>${users[e].name} : ${data.appel[e]}</li>`;
  }
  h+="</ul>";
  content.innerHTML=h;
}
</script>

</body>
</html>
